name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eris-dev-windows:
    name: Eris-Dev Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Windows owned-command regression
        run: node scripts/build-owned-command.cjs && npx vitest run tests/owned-command.test.ts

      - name: Build Eris-Dev Windows x64 installer
        run: npm run dist:dev-app:win -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Build production Windows smoke app
        run: npm run build && npx electron-builder --win --dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Windows worker recovery and packaged preload smoke
        run: npm run check:recovery && node scripts/check-packaged-app.cjs --auto

      - name: Upload Eris-Dev Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Eris-Dev-windows-x64
          path: dist-dev/Eris-Dev-*-win-x64-setup.exe
          if-no-files-found: error
          retention-days: 7

  check:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Desktop client smoke (scripted, no provider calls)
        run: npm run check:client

      - name: Keyboard and focus acceptance (scripted Electron)
        run: npm run check:accessibility

      - name: Scripted chat and workspace performance budgets
        run: npm run check:performance

      - name: Upload performance observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-observations
          path: out/qualification/*performance.json
          if-no-files-found: warn

      - name: Typecheck cloud worker
        run: npm ci --prefix cloud-agent --ignore-scripts && npm run typecheck --prefix cloud-agent

      - name: Quality harness invariants
        run: npm run check:quality

      - name: Real worker process recovery probe
        run: npm run check:recovery

      - name: Package macOS smoke app
        run: npx electron-builder --mac --dir -c.mac.identity=null --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Smoke packaged renderer and preload
        run: node scripts/check-packaged-app.cjs --auto

      - name: Audit desktop, tooling, and cloud worker dependencies
        run: npm run audit:security
