name: Release

# Every v* tag builds macOS + Windows installers into dist/ on CI runners
# and uploads them to the matching GitHub Release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing git tag to build and publish (e.g. v0.2.3). Leave empty to use package.json version.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
            TAG="${TAG#v}"
            echo "tag=v${TAG}" >> "$GITHUB_OUTPUT"
            echo "version=${TAG}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            VERSION="$(node -p "require('./package.json').version")"
            echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: resolve-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Sync package version from tag
        shell: bash
        run: |
          VERSION="${{ needs.resolve-version.outputs.version }}"
          node -e "
            const fs = require('fs');
            const version = process.env.VERSION;
            const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
            pkg.version = version;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            const lock = JSON.parse(fs.readFileSync('package-lock.json','utf8'));
            lock.version = version;
            if (lock.packages && lock.packages['']) lock.packages[''].version = version;
            fs.writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\n');
          "
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}

      - name: Build macOS (dmg + zip)
        if: matrix.platform == 'mac'
        run: |
          if [ -n "$MAC_CERT_P12_BASE64" ]; then
            export CSC_LINK="$MAC_CERT_P12_BASE64"
            export CSC_KEY_PASSWORD="$MAC_CERT_PASSWORD"
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            export APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          else
            unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          fi
          npm run dist:release:mac -- --publish never
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build Windows (.exe installer)
        if: matrix.platform == 'win'
        shell: bash
        run: |
          export CSC_IDENTITY_AUTO_DISCOVERY=false
          npm run dist:release:win -- --publish never

      - name: Collect dist artifacts
        shell: bash
        run: |
          mkdir -p release-assets
          shopt -s nullglob
          if [ "${{ matrix.platform }}" = "mac" ]; then
            for f in dist/*.dmg dist/*.zip dist/*mac*.dmg dist/*mac*.zip dist/latest-mac.yml dist/*.blockmap; do
              [ -f "$f" ] && cp "$f" release-assets/
            done
          else
            for f in dist/*.exe dist/*win*.exe dist/latest.yml dist/*.blockmap; do
              [ -f "$f" ] && cp "$f" release-assets/
            done
          fi
          ls -la release-assets || true
          count=$(find release-assets -type f | wc -l | tr -d ' ')
          if [ "$count" = "0" ]; then
            echo "No artifacts under dist/ for ${{ matrix.platform }}"
            find dist -maxdepth 3 -type f | head -80
            exit 1
          fi

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eris-${{ matrix.platform }}-${{ needs.resolve-version.outputs.version }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [resolve-version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: ls -laR release-assets

      - name: Publish private source release (Eris)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-version.outputs.tag }}
          name: Eris ${{ needs.resolve-version.outputs.tag }}
          draft: false
          generate_release_notes: true
          body: |
            ## Eris ${{ needs.resolve-version.outputs.tag }}

            Cross-platform desktop builds (same `package.json` version).

            Public installers (auto-update feed): https://github.com/EricServices-Repo/Eris-updates/releases/tag/${{ needs.resolve-version.outputs.tag }}

            | Platform | Artifact |
            |----------|----------|
            | macOS (Apple Silicon / Intel) | `Eris-*-mac-*.dmg` / `.zip` |
            | Windows (x64) | `Eris-*-win-*-setup.exe` |

            Install: open the macOS `.dmg` and drag to Applications, or run the Windows setup `.exe`.
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Public feed for electron-updater — clients need no GitHub token.
      # Must pass token: explicitly; env GITHUB_TOKEN alone can still use the job's
      # default integration token (403 on cross-repo releases).
      - name: Publish public update feed (Eris-updates)
        uses: softprops/action-gh-release@v2
        with:
          repository: EricServices-Repo/Eris-updates
          tag_name: ${{ needs.resolve-version.outputs.tag }}
          name: Eris ${{ needs.resolve-version.outputs.tag }}
          draft: false
          token: ${{ secrets.ERIS_UPDATES_TOKEN }}
          body: |
            ## Eris ${{ needs.resolve-version.outputs.tag }}

            Public auto-update feed (macOS zip + Windows setup + `latest-*.yml`).
          files: release-assets/*
