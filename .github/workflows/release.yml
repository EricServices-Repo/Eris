name: Release

# Every v* tag builds macOS + Windows installers into dist/ on CI runners
# and uploads them to the matching GitHub Release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing git tag to build and publish (e.g. v0.2.3). Leave empty to use package.json version.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
            TAG="${TAG#v}"
            echo "tag=v${TAG}" >> "$GITHUB_OUTPUT"
            echo "version=${TAG}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            VERSION="$(node -p "require('./package.json').version")"
            echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Confirm tag is integrated into the approved release line
        env:
          RELEASE_TAG: ${{ steps.ver.outputs.tag }}
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          TAG_COMMIT="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          SOURCE_REF="origin/main"
          if ! git merge-base --is-ancestor "$TAG_COMMIT" "$SOURCE_REF"; then
            echo "${RELEASE_TAG} is not integrated into ${SOURCE_REF}."
            exit 1
          fi
          echo "${RELEASE_TAG} is integrated into ${SOURCE_REF}."

  build:
    needs: resolve-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve-version.outputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Sync package version from tag
        shell: bash
        run: |
          VERSION="${{ needs.resolve-version.outputs.version }}"
          node -e "
            const fs = require('fs');
            const version = process.env.VERSION;
            const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
            pkg.version = version;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            const lock = JSON.parse(fs.readFileSync('package-lock.json','utf8'));
            lock.version = version;
            if (lock.packages && lock.packages['']) lock.packages[''].version = version;
            fs.writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\n');
          "
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}

      # Optional fallback when EricServic.es /api/eris/v1/feedback.php is down.
      # Prefer the website relay (server-side token). Same secret can power both.
      - name: Inject feedback credential
        shell: bash
        env:
          ERIS_FEEDBACK_GITHUB_TOKEN: ${{ secrets.ERIS_FEEDBACK_GITHUB_TOKEN }}
        run: |
          if [ -n "${ERIS_FEEDBACK_GITHUB_TOKEN:-}" ]; then
            printf '%s' "$ERIS_FEEDBACK_GITHUB_TOKEN" > resources/eris-feedback-token
            echo "Wrote resources/eris-feedback-token for packaged fallback"
          else
            echo "ERIS_FEEDBACK_GITHUB_TOKEN secret unset — builds rely on EricServic.es feedback relay only"
          fi

      - name: Build macOS (dmg + zip)
        if: matrix.platform == 'mac'
        run: |
          if [ -n "$MAC_CERT_P12_BASE64" ]; then
            export CSC_LINK="$MAC_CERT_P12_BASE64"
            export CSC_KEY_PASSWORD="$MAC_CERT_PASSWORD"
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            export APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          else
            unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          fi
          npm run dist:release:mac -- --publish never
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build Eris and Eris-Dev Windows (.exe installers)
        if: matrix.platform == 'win'
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          # Fallbacks if the same names as Mac-style base64 secrets are preferred
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          # Prefer WIN_CSC_* (file path, https URL, or base64). Else WINDOWS_CERT_PFX_BASE64.
          if [ -n "${WIN_CSC_LINK:-}" ]; then
            export CSC_LINK="$WIN_CSC_LINK"
            export CSC_KEY_PASSWORD="${WIN_CSC_KEY_PASSWORD:-}"
            echo "Windows code signing: using WIN_CSC_LINK"
          elif [ -n "${WINDOWS_CERT_PFX_BASE64:-}" ]; then
            export CSC_LINK="$WINDOWS_CERT_PFX_BASE64"
            export CSC_KEY_PASSWORD="${WINDOWS_CERT_PASSWORD:-}"
            echo "Windows code signing: using WINDOWS_CERT_PFX_BASE64"
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            echo "Windows code signing: no cert secrets — building unsigned"
          fi
          npm run dist:release:win -- --publish never
          npm run dist:dev-app:win -- --publish never

          # A successful Eris build must not hide a missing debug-app installer.
          shopt -s nullglob
          dev_installers=(dist-dev/Eris-Dev-*-win-x64-setup.exe)
          if [ "${#dev_installers[@]}" -eq 0 ]; then
            echo "Eris-Dev Windows installer was not produced."
            exit 1
          fi

      - name: Collect dist artifacts
        shell: bash
        run: |
          mkdir -p release-assets
          shopt -s nullglob
          if [ "${{ matrix.platform }}" = "mac" ]; then
            for f in dist/*.dmg dist/*.zip dist/*mac*.dmg dist/*mac*.zip dist/latest-mac.yml dist/*.blockmap; do
              [ -f "$f" ] && cp "$f" release-assets/
            done
          else
            for f in dist/*.exe dist/*win*.exe dist/latest.yml dist/*.blockmap; do
              [ -f "$f" ] && cp "$f" release-assets/
            done
            # Keep Eris-Dev separate from the production updater metadata.
            for f in dist-dev/Eris-Dev-*-win-x64-setup.exe dist-dev/*.blockmap; do
              [ -f "$f" ] && cp "$f" release-assets/
            done
          fi
          ls -la release-assets || true
          count=$(find release-assets -type f | wc -l | tr -d ' ')
          if [ "$count" = "0" ]; then
            echo "No artifacts under dist/ for ${{ matrix.platform }}"
            find dist -maxdepth 3 -type f | head -80
            exit 1
          fi

      # Attach installers to the GitHub Release directly. Actions artifact
      # storage is a separate quota and has blocked these builds before.
      - name: Upload installers to the Eris release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.resolve-version.outputs.tag }}" release-assets/* \
            --repo "${{ github.repository }}" \
            --clobber
