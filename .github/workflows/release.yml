name: Release

# Every v* tag builds macOS + Windows installers into dist/ on CI runners
# and uploads them to the matching GitHub Release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing git tag to build and publish (e.g. v0.2.3). Leave empty to use package.json version.'
        required: false
        default: ''
      require_context_certification:
        description: 'Require packaged hardware and paired-model certification (always required for 1.x+).'
        type: boolean
        default: false
      context_evidence_run_id:
        description: 'Workflow run containing ram-context-release-evidence for this exact source SHA (macOS + Windows packaged reports).'
        required: false
        default: ''
      repair_existing:
        description: 'Replace assets of the same immutable tag after a failed upload.'
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      version: ${{ steps.ver.outputs.version }}
      build_ref: ${{ steps.ver.outputs.build_ref }}
      source_sha: ${{ steps.ver.outputs.source_sha }}
      tag_sha: ${{ steps.ver.outputs.tag_sha }}
      lock_sha: ${{ steps.ver.outputs.lock_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve immutable release source
        id: ver
        env:
          RELEASE_TAG_INPUT: ${{ inputs.tag }}
        run: node scripts/release-source.cjs

  context-evidence:
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-version.outputs.build_ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Determine release qualification policy
        id: policy
        env:
          RELEASE_VERSION: ${{ needs.resolve-version.outputs.version }}
          RELEASE_SOURCE_SHA: ${{ needs.resolve-version.outputs.source_sha }}
          CONTEXT_EVIDENCE_RUN_ID: ${{ inputs.context_evidence_run_id || vars.RAM_CONTEXT_EVIDENCE_RUN_ID }}
          REQUIRE_CONTEXT_CERTIFICATION: ${{ inputs.require_context_certification || vars.REQUIRE_CONTEXT_CERTIFICATION }}
        run: node scripts/context-release-policy.cjs
      - name: Deterministic RAM-context gate
        run: npm run check:context
      - name: Download exact-source packaged context evidence
        if: inputs.context_evidence_run_id != '' || vars.RAM_CONTEXT_EVIDENCE_RUN_ID != ''
        uses: actions/download-artifact@v4
        with:
          name: ram-context-release-evidence
          path: out/qualification/release-evidence
          run-id: ${{ inputs.context_evidence_run_id || vars.RAM_CONTEXT_EVIDENCE_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Verify required context certification
        if: steps.policy.outputs.strict == 'true'
        run: npm run check:context:release
      - name: Preserve qualification declaration
        uses: actions/upload-artifact@v4
        with:
          name: context-release-qualification
          path: out/qualification/context-release-verification.json
          if-no-files-found: error

  build:
    needs: [resolve-version, context-evidence]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve-version.outputs.build_ref }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build macOS (dmg + zip)
        if: matrix.platform == 'mac'
        run: |
          if [ -n "$MAC_CERT_P12_BASE64" ]; then
            export CSC_LINK="$MAC_CERT_P12_BASE64"
            export CSC_KEY_PASSWORD="$MAC_CERT_PASSWORD"
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            export APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          else
            unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          fi
          npm run dist:release:mac -- --publish never
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build Eris and Eris-Dev Windows (.exe installers)
        if: matrix.platform == 'win'
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          # Fallbacks if the same names as Mac-style base64 secrets are preferred
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          # Prefer WIN_CSC_* (file path, https URL, or base64). Else WINDOWS_CERT_PFX_BASE64.
          if [ -n "${WIN_CSC_LINK:-}" ]; then
            export CSC_LINK="$WIN_CSC_LINK"
            export CSC_KEY_PASSWORD="${WIN_CSC_KEY_PASSWORD:-}"
            echo "Windows code signing: using WIN_CSC_LINK"
          elif [ -n "${WINDOWS_CERT_PFX_BASE64:-}" ]; then
            export CSC_LINK="$WINDOWS_CERT_PFX_BASE64"
            export CSC_KEY_PASSWORD="${WINDOWS_CERT_PASSWORD:-}"
            echo "Windows code signing: using WINDOWS_CERT_PFX_BASE64"
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            echo "Windows code signing: no cert secrets — building unsigned"
          fi
          npm run dist:release:win -- --publish never
          npm run dist:dev-app:win -- --publish never

          # A successful Eris build must not hide a missing debug-app installer.
          shopt -s nullglob
          dev_installers=(dist-dev/Eris-Dev-*-win-x64-setup.exe)
          if [ "${#dev_installers[@]}" -eq 0 ]; then
            echo "Eris-Dev Windows installer was not produced."
            exit 1
          fi

      - name: Smoke packaged production app
        run: node scripts/check-packaged-app.cjs --auto

      - name: Collect dist artifacts
        shell: bash
        run: |
          mkdir -p release-assets
          shopt -s nullglob
          if [ "${{ matrix.platform }}" = "mac" ]; then
            for f in dist/*.dmg dist/*.zip dist/*mac*.dmg dist/*mac*.zip dist/latest-mac.yml dist/*.blockmap; do
              [ -f "$f" ] && cp "$f" release-assets/
            done
          else
            for f in dist/*.exe dist/*win*.exe dist/latest.yml dist/*.blockmap; do
              [ -f "$f" ] && cp "$f" release-assets/
            done
            # Keep Eris-Dev separate from the production updater metadata.
            for f in dist-dev/Eris-Dev-*-win-x64-setup.exe dist-dev/*.blockmap; do
              [ -f "$f" ] && cp "$f" release-assets/
            done
          fi
          ls -la release-assets || true
          count=$(find release-assets -type f | wc -l | tr -d ' ')
          if [ "$count" = "0" ]; then
            echo "No artifacts under dist/ for ${{ matrix.platform }}"
            find dist -maxdepth 3 -type f | head -80
            exit 1
          fi

      - name: Download qualification declaration
        uses: actions/download-artifact@v4
        with:
          name: context-release-qualification
          path: qualification
      - name: Include qualification declaration
        shell: bash
        run: cp qualification/context-release-verification.json release-assets/context-qualification-${{ matrix.platform }}.json

      - name: Record artifact provenance
        shell: bash
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
          RELEASE_TAG: ${{ needs.resolve-version.outputs.tag }}
          RELEASE_SOURCE_SHA: ${{ needs.resolve-version.outputs.source_sha }}
          RELEASE_TAG_SHA: ${{ needs.resolve-version.outputs.tag_sha }}
          RELEASE_LOCK_SHA: ${{ needs.resolve-version.outputs.lock_sha }}
        run: node scripts/release-source.cjs manifest release-assets

      - name: Upload installers and provenance
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.resolve-version.outputs.tag }}
          REPAIR_EXISTING: ${{ inputs.repair_existing }}
        run: |
          args=()
          if [ "$REPAIR_EXISTING" = "true" ]; then args+=(--clobber); fi
          gh release upload "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" "${args[@]}"
