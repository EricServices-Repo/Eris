name: Branch policy

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-target:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Validate target branch
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if [ "$BASE_REF" != "main" ]; then
            echo "Pull requests must target main (received base=$BASE_REF)."
            exit 1
          fi

          if [ "$HEAD_REF" = "main" ]; then
            echo "A pull request cannot use main as its own head branch."
            exit 1
          fi

          echo "Pull request into main is allowed from $HEAD_REF."
