# Eris Cloud Agent status page on host :80
# Proxies to the container status server (host 8080 → container 8080).
#
# Installed by: ./cloud-agent/scripts/rebuild.sh --install
#   → /etc/nginx/conf.d/eris-cloud-status.conf
#
# Requires Quadlet PublishPort=8080:8080 (not 80:8080 — nginx owns :80).

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name agents.ericservic.es _;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}
