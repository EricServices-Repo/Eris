# CPU-only Cloud Agent (no NVIDIA reservation).
#   docker compose -f cloud-agent/docker-compose.cpu.yml up -d --build
#   ./cloud-agent/scripts/rebuild.sh --cpu --compose

services:
  eris-cloud-agent:
    build:
      context: .
      target: runtime-cpu
    image: eris-cloud-agent:latest
    container_name: eris-cloud-agent
    restart: unless-stopped
    ports:
      - "6443:6443"
      - "8080:8080"
    environment:
      ERIS_CLOUD_PUBLIC_URL: https://agents.ericservic.es:443
      ERIS_CLOUD_HOST: "0.0.0.0"
      ERIS_CLOUD_PORT: "6443"
      ERIS_CLOUD_STATUS_PORT: "8080"
      ERIS_CLOUD_DATA: /var/lib/eris-cloud
      ERIS_CLOUD_MAX_PARALLEL: "1"
      ERIS_CLOUD_GPU: "false"
      ERIS_CLOUD_MAX_THREADS: "2"
      ERIS_CLOUD_CONTEXT_SIZE: "2048"
      ERIS_CLOUD_WARM_ON_START: "0"
    cpus: 2
    mem_limit: 8g
    volumes:
      - eris-cloud-data:/var/lib/eris-cloud
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:6443/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 8s
      retries: 8
      start_period: 600s

volumes:
  eris-cloud-data:
